<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,200;0,400;0,700;1,700&family=Merriweather:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/page.css" />
    <script type="importmap">
      {
        "imports": {
          "@unbndl/auth": "https://unpkg.com/@unbndl/auth",
          "@unbndl/html": "https://unpkg.com/@unbndl/html",
          "@unbndl/view": "https://unpkg.com/@unbndl/view"
        }
      }
    </script>
    <script type="module">
      import { define } from "@unbndl/html";
      import { Auth } from "@unbndl/auth";
      import { LoginFormElement } from "/js/login-form.js";

      define({
        "auth-provider": Auth.Provider,
        "login-form": LoginFormElement
      });
    </script>
    <style>
      .page {
        height: 100vh;
      }

      auth-provider {
        grid-column: 1 / -1;
      }

      main.card {
        align-self: center;
        grid-column: calc(var(--page-grids)/2 - 2) / span 4;
      }

      h2 {
        align-self: end;
      }

      p {
        grid-column: 2 / -2;
        text-align: center;
      }
    </style>
  </head>
  <body class="page">
    <auth-provider>
      <h2>User Login</h2>
      <main class="card">
        <login-form api="/auth/login">
          <label>
            <span>Username:</span>
            <input name="username" autocomplete="off" />
          </label>
          <label>
            <span>Password:</span>
            <input type="password" name="password" />
          </label>
        </login-form>
      </main>
      <p>
        Or did you want to <a href="register.html">Register as a new user</a>?
      </p>
    </auth-provider>
  </body>
</html>
